name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual runs create the tag on the commit they run from.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.10.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches src/version.h
        shell: pwsh
        run: |
          $match = Select-String -Path src/version.h -Pattern 'BS_VERSION_STRING "([0-9.]+)"'
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne "$env:TAG") { throw "Tag $env:TAG does not match version $version in src/version.h" }
          "VERSION=$version" >> $env:GITHUB_ENV
      - name: Configure MSVC build
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Run tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          $name = "BatteryScope-$env:VERSION-win64"
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build/Release/BatteryScope.exe package/
          # The embedded pixel font is SIL OFL 1.1: its license ships with the binary.
          Copy-Item src/assets/pixel-ui-OFL.txt package/
          Compress-Archive -Path package/* -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - name: Build installer
        shell: pwsh
        run: |
          $setup = ./installer/build-installer.ps1 | Select-Object -Last 1
          $name = Split-Path $setup -Leaf
          Copy-Item $setup $name
          $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$name.sha256"
      - name: Test installer end to end
        timeout-minutes: 10
        shell: pwsh
        run: ./installer/test-installer.ps1 -Setup "BatteryScope-$env:VERSION-setup.exe"
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "BatteryScope-$env:VERSION-win64"
          $notes = "docs/releases/$($env:TAG).md"
          if (Test-Path $notes) {
            gh release create "$env:TAG" "BatteryScope-$env:VERSION-setup.exe" "BatteryScope-$env:VERSION-setup.exe.sha256" "$name.zip" "$name.zip.sha256" --target "${{ github.sha }}" --title "BatteryScope $env:VERSION" --notes-file $notes
          } else {
            gh release create "$env:TAG" "BatteryScope-$env:VERSION-setup.exe" "BatteryScope-$env:VERSION-setup.exe.sha256" "$name.zip" "$name.zip.sha256" --target "${{ github.sha }}" --title "BatteryScope $env:VERSION" --generate-notes
          }
